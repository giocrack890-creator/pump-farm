<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#163528"/>
      <stop offset="100%" stop-color="#0B0F0E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B3A22"/>
      <stop offset="100%" stop-color="#3A2414"/>
    </linearGradient>
    <linearGradient id="crop" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1FCF63"/>
      <stop offset="100%" stop-color="#3DFF7A"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#3DFF7A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <ellipse cx="320" cy="430" rx="210" ry="28" fill="#000" opacity="0.35"/>
  <g filter="url(#soft)">
    <path d="M120 300 L320 210 L520 300 L320 390 Z" fill="url(#soil)"/>
    <path d="M120 300 L320 390 L320 420 L120 330 Z" fill="#2A1A0F"/>
    <path d="M520 300 L320 390 L320 420 L520 330 Z" fill="#1E120A"/>
    <!-- crop rows -->
    <path d="M220 300 L280 270 L300 280 L240 310 Z" fill="url(#crop)" opacity="0.9"/>
    <path d="M270 325 L330 295 L350 305 L290 335 Z" fill="url(#crop)" opacity="0.85"/>
    <path d="M320 350 L380 320 L400 330 L340 360 Z" fill="url(#crop)" opacity="0.8"/>
    <!-- silo / barn -->
    <rect x="380" y="250" width="54" height="70" rx="6" fill="#C45C26" transform="skewY(-18) translate(40 70)"/>
    <path d="M410 235 L460 255 L460 270 L410 250 Z" fill="#8B3A16"/>
    <rect x="430" y="260" width="18" height="40" fill="#FFC94D" opacity="0.9"/>
    <!-- candlestick beanstalk -->
    <rect x="300" y="120" width="18" height="160" rx="4" fill="#1FCF63"/>
    <rect x="270" y="150" width="78" height="28" rx="4" fill="#3DFF7A"/>
    <rect x="285" y="95" width="48" height="40" rx="4" fill="#3DFF7A"/>
    <path d="M309 70 L340 100 L278 100 Z" fill="#3DFF7A"/>
  </g>
</svg>
